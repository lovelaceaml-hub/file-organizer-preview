name: Organizer preview check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_preview.py -k test_plan_stays_within_the_selected_folder
